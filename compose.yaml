services:
  home-lab-companion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-lab-companion
    restart: unless-stopped
    ports:
      - "8080:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - companion

networks:
  companion:
    driver: bridge
